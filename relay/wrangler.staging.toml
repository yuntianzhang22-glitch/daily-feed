# 预发模板。运行 npm run relay:deploy:staging 自动建立独立 KV 并生成本地配置。
name = "daily-feed-relay-staging"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "../mobile/dist"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "ACCESS"
id = "REPLACE_WITH_SEPARATE_STAGING_KV_ID"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LedgerDO"]

[[durable_objects.bindings]]
name = "MOBILE_SCHEDULE"
class_name = "MobileScheduleDO"

[[migrations]]
tag = "v2-mobile-schedule"
new_sqlite_classes = ["MobileScheduleDO"]

# Disabled until an actual Azure Translator F0 resource is configured.
[vars]
TRANSLATION_TIER = "disabled"
TRANSLATION_MONTHLY_LIMIT = "1800000"

[[durable_objects.bindings]]
name = "TRANSLATION"
class_name = "TranslationDO"

[[migrations]]
tag = "v3-translation"
new_sqlite_classes = ["TranslationDO"]

# Feedback data never shares tables with account balances or translation.
[[durable_objects.bindings]]
name = "FEEDBACK"
class_name = "FeedbackDO"

[[migrations]]
tag = "v4-feedback"
new_sqlite_classes = ["FeedbackDO"]
