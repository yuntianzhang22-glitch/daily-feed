name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:mobile
      - run: npm run test:ui
      - name: Build production app
        run: npm run dist
      - name: Verify complete development repository
        run: node build/check-repository.mjs
